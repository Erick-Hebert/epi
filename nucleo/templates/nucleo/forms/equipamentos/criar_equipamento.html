{% extends 'nucleo/base.html' %}
{% block title %}Criar equipamento{% endblock %}
{% block content %}
<section class="content-card form-card">
    <h1>Criar equipamento</h1>
    <p class="description">Preencha os dados do novo equipamento.</p>
    <form class="collaborator-form" action="{% url 'equipamentos-salvar' %}" method="post">
         {% csrf_token %}
         <div class="form-field"><label for="nome">Nome</label><input id="nome" name="nome" type="text" maxlength="30" required></div>
         <div class="form-field"><label for="telefone">Código de patrimônio</label><input id="telefone" name="telefone" type="tel" maxlength="30"></div>
         <div class="form-field"><label for="telefone">Quantidade</label><input id="telefone" name="telefone" type="tel" maxlength="30"></div>
         <div class="form-field"><label for="telefone">Descrição</label><input id="telefone" name="telefone" type="tel" maxlength="30"></div>
         <div class="form-field"><label for="telefone">Categoria</label><input id="telefone" name="telefone" type="tel" maxlength="30"></div>
         
        <div class="form-actions"><a class="button button-secondary" href="{% url 'equipamentos-inicial' %}">Cancelar</a><button class="button button-primary" type="submit">Salvar</button></div>
    </form>
</section>
{% endblock %}
