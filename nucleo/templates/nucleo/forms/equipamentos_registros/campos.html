{% if form.non_field_errors %}
<div class="form-error" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
<div class="form-field">
    {{ field.label_tag }}
    {{ field }}
    {% if field.errors %}
    <div class="form-error" role="alert">{{ field.errors }}</div>
    {% endif %}
</div>
{% endfor %}
