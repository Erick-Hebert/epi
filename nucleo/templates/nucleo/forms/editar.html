{% extends 'nucleo/base.html' %}
{% block title %}Editar colaborador{% endblock %}
{% block content %}
<section class="content-card form-card">
    <h1>Editar colaborador</h1>
    <p class="description">Atualize os dados do colaborador.</p>
    <form class="collaborator-form" action="{% url 'nucleo-editar' colaborador.id %}" method="post">
        {% csrf_token %}
        <div class="form-field"><label for="nome">Nome</label><input id="nome" name="nome" type="text" maxlength="30" value="{{ colaborador.nome }}" required></div>
        <div class="form-field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" maxlength="30" value="{{ colaborador.telefone|default_if_none:'' }}"></div>
        <div class="form-actions"><a class="button button-secondary" href="{% url 'nucleo-inicial' %}">Cancelar</a><button class="button button-primary" type="submit">Salvar alterações</button></div>
    </form>
</section>
{% endblock %}
