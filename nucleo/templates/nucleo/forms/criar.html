{% extends 'nucleo/base.html' %}
{% block title %}Criar colaborador{% endblock %}
{% block content %}
<section class="content-card form-card">
    <h1>Criar colaborador</h1>
    <p class="description">Preencha os dados do novo colaborador.</p>
    <form class="collaborator-form" action="{% url 'nucleo-salvar' %}" method="post">
        {% csrf_token %}
        <div class="form-field"><label for="nome">Nome</label><input id="nome" name="nome" type="text" maxlength="30" required></div>
        <div class="form-field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" maxlength="30"></div>
        <div class="form-actions"><a class="button button-secondary" href="{% url 'nucleo-inicial' %}">Cancelar</a><button class="button button-primary" type="submit">Salvar</button></div>
    </form>
</section>
{% endblock %}
