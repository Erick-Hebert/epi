{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Colaboradores{% endblock %} | Controle de EPI</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    
    {% if messages %}
        <div class="msg-toast-container">
            {% for message in messages %}
            <div class="msg-toast {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    {% include 'nucleo/partials/header.html' %}
    <div class="app-layout">
        {% include 'nucleo/partials/sidebar.html' %}
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
